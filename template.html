<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1215">
<title>Отношения нельзя завести</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: неподвижная «сцена» путешествия сверху, одна колонка текста под ней; только телефонная ширина */
:root {
  --ink: #0f1215;
  --ink-2: #171c21;
  --paper: #ddd7cc;
  --paper-hi: #f3eee5;
  --muted: #8a9097;
  --rule: #2a3138;
  --accent: #d8774a;
  --display: 'Prata', 'Georgia', serif;
  --body: 'Literata', 'Georgia', serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Menlo', monospace;
  --stage-h: clamp(170px, 50vw, 260px);
  --col: 460px;
  --stage-w: 720px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--ink); }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 17px; line-height: 1.62; -webkit-font-smoothing: antialiased; }

.stage {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: min(100%, var(--stage-w)); z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--ink);
}
.stage-inner { position: relative; height: var(--stage-h); overflow: hidden; }
.stage::after { content: ''; position: absolute; left: 0; right: 0; bottom: -40px; height: 40px; background: linear-gradient(var(--ink), rgba(15,18,21,0)); pointer-events: none; }
#scene { display: block; width: 100%; height: 100%; touch-action: pan-y; }

.chip, .cap, .markbtn { position: absolute; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; }
.chip { top: 10px; left: 12px; color: var(--muted); text-transform: uppercase; background: rgba(15,18,21,.55); padding: 3px 7px; border-radius: 3px; }
.markbtn { top: 6px; right: 8px; color: var(--paper); background: rgba(15,18,21,.6); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; font-size: 11px; cursor: pointer; }
.cap { left: 12px; right: 12px; bottom: 12px; color: var(--paper-hi); text-shadow: 0 1px 2px rgba(0,0,0,.8); line-height: 1.35; pointer-events: none; }
.cap b { color: var(--accent); font-weight: 500; }
.cap span { display: inline; padding: 2px 6px; margin-left: -6px; border-radius: 4px; transition: background .6s, color .6s; }
.cap.pulse span { background: var(--accent); color: var(--ink); text-shadow: none; }
.cap.pulse b { color: var(--ink); }
.rw { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink); background: var(--paper-hi); padding: 3px 9px; border-radius: 3px; }
.backbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 8px); z-index: 12; display: flex; align-items: center; background: var(--paper-hi); color: var(--ink); border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.45); font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; }
.backbar button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 8px 12px; }
.backbar .backchip { padding-left: 15px; }
.backbar .backx { padding-right: 14px; padding-left: 8px; opacity: .6; font-size: 14px; line-height: 1; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.07); }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
.bar i { position: absolute; top: -2px; width: 5px; height: 7px; margin-left: -2px; border-radius: 2px; background: var(--paper); opacity: .55; }

.play { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: radial-gradient(ellipse at center, rgba(15,18,21,.15), rgba(15,18,21,.75)); }
.play p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper); opacity: .8; }
.play button { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; border: 1px solid var(--paper); background: rgba(15,18,21,.5); cursor: pointer; }
.play button svg { width: 22px; height: 22px; margin-left: 4px; fill: var(--paper-hi); }

.col { max-width: var(--col); margin: 0 auto; padding-inline: 20px; padding-block: calc(var(--stage-h) + env(safe-area-inset-top, 0px) + 36px) 45vh; }
.cp { margin-top: 3.4rem; }
.cp:first-child { margin-top: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2.05rem; line-height: 1.15; margin: 0 0 1.4rem; color: var(--paper-hi); text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.42rem; line-height: 1.25; margin: 0 0 1.2rem; color: var(--paper-hi); text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 400; font-size: 1.12rem; margin: 2rem 0 .8rem; color: var(--paper-hi); }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .55rem; }
.col p { margin: 0 0 .8em; }
strong { color: var(--paper-hi); font-weight: 600; }

.rest { margin-top: 2rem; padding-block: 1.1rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: grid; gap: .5rem; justify-items: start; }
.rest p { margin: 0; font-size: 15px; color: var(--paper); }
.rest .rest-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

.btn { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; border-radius: 999px; padding: 9px 15px; cursor: pointer; border: 1px solid var(--paper); background: var(--paper-hi); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--rule); }
.btn:focus-visible, .markbtn:focus-visible, .backbar button:focus-visible, .play button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 20; width: min(100%, var(--col)); background: var(--ink-2); border-top: 1px solid var(--rule); padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
.sheet h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.1rem; color: var(--paper-hi); }
.sheet p { margin: 0; font-size: 14.5px; color: var(--paper); line-height: 1.5; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--paper-hi); color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 9px 14px; border-radius: 8px; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-inner">
    <canvas id="scene" aria-label="Путешествие девушки: меняется по мере чтения"></canvas>
    <span class="chip">Черновик · грейбокс</span>
    <button type="button" class="markbtn" id="markbtn">Закладка</button>
    <div class="cap" id="cap" aria-live="polite"></div>
    <span class="rw" id="rw" hidden>⏪ перемотка</span>
        <div class="bar" id="bar"><div class="bar-fill" id="barfill"></div></div>
    <div class="play" id="play">
      <button type="button" id="playbtn" aria-label="Начать путь"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></button>
      <p>Начать путь</p>
    </div>
  </div>
  <div class="backbar" id="backbar" hidden>
    <button type="button" class="backchip" id="backchip">Вернуться к месту чтения ↓</button>
    <button type="button" class="backx" id="backx" aria-label="Скрыть">✕</button>
  </div>
</div>

<main class="col" id="col">
{{ARTICLE}}
</main>

<div class="sheet" id="resume" hidden>
  <h4>С возвращением</h4>
  <p id="resume-text"></p>
  <div class="row">
    <button type="button" class="btn" id="resume-go">Продолжить</button>
    <button type="button" class="btn ghost" id="resume-start">Читать сначала</button>
  </div>
</div>

<div class="sheet" id="mark" hidden>
  <h4>Закладка</h4>
  <p>Место сохраняется само, на этом телефоне и в этом браузере. Чтобы открыть статью с этого места где угодно, скопируйте ссылку.</p>
  <div class="row">
    <button type="button" class="btn js-copy" data-cp="current">Скопировать ссылку на это место</button>
    <button type="button" class="btn ghost" id="mark-restart">Начать путь сначала</button>
    <button type="button" class="btn ghost" id="mark-close">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ============ СЦЕНАРИЙ: одна строка = одна точка ============
   m   — способ движения (или фазы [[способ, до какой доли раздела], ...])
   set — что меняется на девушке: h шляпка, f цветок, b корзинка (0 нет, 1 полная, 2 половина, 3 со щенком), c компас
   ia  — на какой доле раздела срабатывает set; tod — время суток; p — предмет в мире; comp — другой персонаж; sp — особый эффект
*/
const S = [
  {a:'Выходит из-за края экрана и идёт по лугу', m:'walk', tod:'morning'},
  {a:'Шляпка на столбике. Надевает', m:'walk', set:{h:1}, ia:.06, p:{l:'шляпка на столбике', w:8, h:34, px:10}},
  {a:'Вдали проезжает поезд. Она не оборачивается', m:'walk', sp:'train'},
  {a:'Срывает цветок, вставляет в шляпку', m:'walk', set:{f:1}, ia:.06, p:{l:'цветок', w:6, h:14, px:10}},
  {a:'Лезет вверх по лестнице в облака', m:'climb'},
  {a:'На середине останавливается и спускается', m:[['descend',.7],['stand',1]]},
  {a:'Кладёт лестницу через ручей и идёт по ней, как по мосту', m:[['stand',.25],['walk',1]]},
  {a:'Ёжики переходят дорогу. Она ждёт', m:[['walk',.2],['stand',.7],['walk',1]], sp:'hedgehogs'},
  {a:'Берёт готовую корзинку с пенька', m:'walk', set:{b:1}, ia:.06, p:{l:'пенёк с корзинкой', w:30, h:16, px:10}},
  {a:'Пикник. Корзинка пустеет наполовину, помидор остаётся на пледе', m:[['walk',.12],['sit',.8],['walk',1]], set:{b:2}, ia:.75, p:{l:'плед', w:64, h:4, px:30}, rest:1},
  {a:'Находит компас: направление, а не цель', m:'walk', set:{c:1}, ia:.06, p:{l:'компас на камне', w:22, h:12, px:10}},
  {a:'Щенок на обочине. Сажает его в пустую половину корзинки', m:[['walk',.08],['stand',.3],['walk',1]], set:{b:3}, ia:.22, p:{l:'щенок', w:14, h:10, px:22}},
  {a:'Ждёт автобус. Листаете, а он не едет', m:[['walk',.06],['sit',1]], p:{l:'остановка', w:64, h:62, px:16}},
  {a:'Встаёт и берёт велосипед за остановкой', m:[['stand',.2],['bike',1]]},
  {a:'Становится день. Рядом пристраивается попутчик', m:'bike', tod:'day', comp:'bike'},
  {a:'Выцветший указатель. Надпись не разобрать', m:'bikeSlow', comp:'bike', p:{l:'указатель «???»', w:6, h:52, px:70}},
  {a:'Переключает передачу: скорость меняется', m:[['bike',.5],['bikeFast',1]], comp:'bike'},
  {a:'Развилка. Попутчик сворачивает, она смотрит вслед', m:[['bike',.25],['bikeStop',1]], comp:'leave', p:{l:'развилка', w:44, h:4, px:30}},
  {a:'Его дорога идёт параллельно, на той же высоте. Машет и едет дальше', m:[['bikeStop',.35],['bike',1]], comp:'far', sp:'wave'},
  {a:'Дом щенка. Оставляет его у двери и едет дальше', m:[['bike',.3],['bikeStop',.6],['bike',1]], set:{b:2}, ia:.48, p:{l:'дом щенка', w:52, h:48, px:70}},
  {a:'Проезжает калитку и закрывает её за собой', m:'bike', p:{l:'калитка', w:6, h:28, px:60}},
  {a:'Вечер. Привал у костра', m:[['bike',.12],['sit',1]], tod:'evening', rest:1, p:{l:'костёр', w:16, h:14, px:150}},
  {a:'Утро. К реке на велосипеде нельзя: пересаживается в лодку', m:[['bike',.3],['stand',.5],['boat',1]], tod:'morning'},
  {a:'Проплывает мимо башни с бесконечной лестницей', m:'boat', p:{l:'башня', w:30, h:150, px:220}},
  {a:'Вдоль берега одинаковые домики, как по линейке', m:'boat', sp:'houses'},
  {a:'Причаливает к берегу. Мост перекрыт. Сверяется с компасом и поворачивает налево', m:[['boat',.2],['stand',.3],['walk',.5],['stand',.72],['walkLs',1]], p:{l:'мост перекрыт', w:70, h:30, at:[25,.5], px:34}},
  {a:'Тропа уходит вверх, и она снова идёт вправо: поверху, над перекрытым мостом', m:'walk', sp:'detour'},
  {a:'Кафе у дороги. Садится и наливает собеседнику чай', m:[['walk',.3],['sit',1]], comp:'cafe'},
  {a:'Банка с красивой этикеткой. Внутри почти пусто', m:'sit', comp:'cafe', rest:1, sp:'jar'},
  {a:'Заглядывает в корзинку: что там осталось?', m:[['stand',.35],['walk',1]]},
  {a:'Поправляет шляпку на ходу', m:'walk', sp:'adjust'},
  {a:'Ручка корзинки рвётся. Оставляет её на скамейке', m:[['walk',.3],['stand',.6],['walk',1]], set:{b:0}, ia:.5, p:{l:'скамейка', w:44, h:14, px:60}},
  {a:'Луг, как в самом начале. Но шляпка и компас с ней', m:'walk'},
  {a:'Ветер уносит цветок. Она отпускает', m:'walk', set:{f:0}, ia:.4, sp:'wind'},
  {a:'Начинается дождь. Она идёт дальше', m:'walk', tod:'rain', sp:'rain'},
  {a:'Развилка под дождём: выбирает путь вперёд', m:[['stand',.6],['walk',1]], sp:'rain', p:{l:'укрытие ↑ · вперёд →', w:44, h:4, px:10}},
  {a:'Привал под навесом. Дождь стихает', m:[['sit',.65],['walk',1]], rest:1, tod:'overcast', p:{l:'навес', w:56, h:54, px:6}},
  {a:'Маленький аэродром. Взлетает', m:[['walk',.3],['fly',1]], tod:'day'},
  {a:'Птицы летят привычным клином. Она берёт свой курс', m:'fly', sp:'birds'},
  {a:'Узкий просвет между облаками. Пролетает в него', m:'fly', sp:'clouds'},
  {a:'Рядом появляется второй самолёт', m:'fly', comp:'plane2'},
  {a:'Покачали крыльями и разошлись', m:'fly', comp:'plane2Away'},
  {a:'Приземляется. Привал на крыле', m:[['fly',.45],['sit',1]], rest:1},
  {a:'Вечер. Звёзды зажигаются одна за другой', m:'walk', tod:'evening', sp:'stars'},
  {a:'Столбик забора, как в точке 1. Шляпка уже на ней', m:'walk', sp:'stars', p:{l:'столбик, как в точке 1', w:8, h:34, px:60}},
  {a:'Деревня ночью, светятся окна', m:'walk', tod:'night', sp:'windows'},
  {a:'Рассвет. Начинается обычный день', m:'walk', tod:'dawn', sp:'windows'},
  {a:'Привал на холме. Виден весь пройденный путь', m:[['walk',.15],['sit',1]], rest:1, sp:'zoomOut'},
  {a:'Скамейка, рядом свободное место', m:[['walk',.06],['sit',1]], sp:'zoomBack', p:{l:'свободное место', w:52, h:14, px:30}}
];

/* ============ движение ============ */
const SPEED = {walk:1, walkL:-1, walkLs:-.6, bike:1.7, bikeSlow:.6, bikeFast:2.8, bikeStop:0, boat:1.3, fly:2.2, stand:0, sit:0, climb:0, descend:0};
const K = 0.9;           // сколько «шагов мира» на пиксель прокрутки
const N = S.length - 1;  // 48
const REST = S.map((s,i)=>s.rest?i:-1).filter(i=>i>=0);
const PUBLIC_URL = 'https://legendpsy.github.io/relations-essay/';
const STORE = 'relations-essay-v1';

const phasesOf = st => Array.isArray(st.m) ? st.m : [[st.m, 1]];
function modeAt(st, f){ for (const [m,u] of phasesOf(st)) if (f < u) return m; const p = phasesOf(st); return p[p.length-1][0]; }
function distFrac(st, f){ let d=0, prev=0; for (const [m,u] of phasesOf(st)){ const e=Math.min(f,u); if (e>prev) d+=(e-prev)*SPEED[m]; prev=u; if (f<=u) break; } return d; }
const isBike = m => m.startsWith('bike');

// накопленное состояние девушки и время суток
const IT = [], TOD = [];
S.forEach((s,i)=>{ IT[i] = Object.assign({h:0,f:0,b:0,c:0}, i?IT[i-1]:{}, s.set||{}); TOD[i] = s.tod || TOD[i-1]; });

/* ============ палитры (небо верх, небо низ, дальние холмы, ближние, земля) ============ */
const PAL = {
  morning:  ['#33465a','#8d968c','#3f5146','#2f3f33','#222d25'],
  day:      ['#4d6d86','#a9b5a8','#4c6150','#3a4c3c','#2a3729'],
  evening:  ['#2f2840','#b0715a','#3b3240','#2c2630','#1f1b22'],
  rain:     ['#30383f','#5a6369','#363f40','#2b3233','#202627'],
  overcast: ['#3c4650','#7d878a','#3d4842','#303a34','#242c27'],
  night:    ['#0b1020','#1d2538','#161c28','#11161f','#0c1016'],
  dawn:     ['#3a3452','#c9967a','#3f3a46','#302c36','#221f27']
};
const hex = h => [1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
let colNow = PAL.morning.map(hex);
const rgb = c => `rgb(${c.map(Math.round).join(',')})`;

/* ============ разметка ============ */
const stageEl = document.getElementById('stage'), cv = document.getElementById('scene'), ctx = cv.getContext('2d');
const secs = [...document.querySelectorAll('.cp')];
let starts = [], lens = [], D = [], W = 0, H = 0, dpr = 1, trig = 0;

function measure(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const stageH = stageEl.offsetHeight;
  trig = stageH + (window.innerHeight - stageH) * 0.35;
  starts = secs.map((el,i)=> i===0 ? 0 : el.getBoundingClientRect().top + window.scrollY - trig);
  for (let i=1;i<starts.length;i++) starts[i] = Math.max(starts[i], starts[i-1]+1);
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  starts.push(Math.max(maxScroll, starts[starts.length-1] + 1));
  lens = S.map((_,i)=> starts[i+1] - starts[i]);
  D = [0]; S.forEach((s,i)=> D[i+1] = D[i] + lens[i]*K*distFrac(s,1));
  buildBar();
}
function locate(s){ let i=0; while (i<N && s >= starts[i+1]) i++; return {i, f: Math.min(1, Math.max(0, (s-starts[i]) / lens[i]))}; }
const scrollFor = (i,f) => starts[i] + f*lens[i];
const worldAt = (i,f) => D[i] + lens[i]*K*distFrac(S[i],f);

/* ============ прогресс-полоска ============ */
const bar = document.getElementById('bar'), barfill = document.getElementById('barfill');
function buildBar(){
  bar.querySelectorAll('i').forEach(n=>n.remove());
  const total = starts[N+1];
  REST.forEach(i=>{ const t=document.createElement('i'); t.style.left = (100*starts[i]/total)+'%'; t.title='Привал'; bar.appendChild(t); });
}

/* ============ состояние чтения ============ */
let started = false, enterT = null, maxS = 0, sceneS = 0, camX = 0, alt = 0, lastScrollT = performance.now();
let backDismissed = false, lastY = 0, rewindUntil = 0, pulseT = -1e9, lastCp = 0, lastItemsKey = '';
const capEl = document.getElementById('cap'), backchip = document.getElementById('backchip'), backbar = document.getElementById('backbar'), rwEl = document.getElementById('rw');

function load(){ try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){ return null; } }
function save(){
  try {
    const c = locate(window.scrollY), m = locate(maxS);
    localStorage.setItem(STORE, JSON.stringify({cur:[c.i,c.f], max:[m.i,m.f], t:Date.now()}));
  } catch(e){}
}
let saveTimer = 0;
function onScroll(){
  lastScrollT = performance.now();
  const y = window.scrollY;
  if (y < lastY - 2) rewindUntil = performance.now() + 450;
  lastY = y;
  if (!started && y > 40) start(false);
  if (started && y > maxS) maxS = y;
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 700);
}
function start(withEnter){ if (started) return; started = true; enterT = withEnter ? performance.now() : null; document.getElementById('play').hidden = true; maxS = Math.max(maxS, window.scrollY); }

/* ============ рисование ============ */
const BASEZOOM = 1.4;
const groundY = () => H*0.8;
const GX = () => W*0.36;
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

function hills(base, amp, par, col, seed){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-W*3, base+3000);
  for (let x=-W*3; x<=W*4; x+=14){ const p = x + camX*par; ctx.lineTo(x, base + Math.sin(p*.0035+seed)*amp + Math.sin(p*.011+seed*2)*amp*.35); }
  ctx.lineTo(W*4, base+3000); ctx.closePath(); ctx.fill();
}

function propBox(x, p, gy){
  const w=p.w, h=p.h;
  ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle='rgba(243,238,229,.7)'; ctx.lineWidth=1.3;
  ctx.fillStyle='rgba(243,238,229,.08)'; ctx.fillRect(x-w/2, gy-h, w, h); ctx.strokeRect(x-w/2, gy-h, w, h);
  ctx.setLineDash([]); ctx.fillStyle='rgba(243,238,229,.85)'; ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='center';
  ctx.fillText(p.l, x, gy-h-6); ctx.restore();
}

function basket(x, y, b){
  if (!b) return;
  ctx.save(); ctx.strokeStyle='#c9a36b'; ctx.lineWidth=1.6; ctx.strokeRect(x-5, y-4, 10, 8);
  ctx.fillStyle='#c9a36b'; const lvl = b===1 ? 8 : 4; ctx.fillRect(x-5, y+4-lvl, 10, lvl);
  ctx.beginPath(); ctx.arc(x, y-4, 5, Math.PI, 0); ctx.stroke();
  if (b===3){ ctx.fillStyle='#a8784e'; ctx.fillRect(x-4, y-10, 8, 6); ctx.fillRect(x+1, y-13, 3, 3); }
  ctx.restore();
}

function bike(ph){
  ctx.strokeStyle='#9aa4ad'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(-13,-9,9,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(13,-9,9,0,7); ctx.stroke();
  line(-13,-9,-2,-24); line(-2,-24,13,-9); line(-2,-24,11,-28); line(11,-28,13,-9); line(-6,-26,2,-26);
}
function boat(){ ctx.fillStyle='#6b5040'; ctx.beginPath(); ctx.moveTo(-34,-12); ctx.lineTo(34,-12); ctx.lineTo(24,2); ctx.lineTo(-24,2); ctx.closePath(); ctx.fill(); }
function plane(ph, col){
  ctx.fillStyle = col || '#b8c0c6'; ctx.beginPath(); ctx.ellipse(0,-10,36,8,0,0,7); ctx.fill();
  ctx.fillRect(-8,-13,16,4); ctx.beginPath(); ctx.moveTo(-34,-12); ctx.lineTo(-42,-26); ctx.lineTo(-30,-14); ctx.fill();
  ctx.strokeStyle='#e8e2d6'; ctx.lineWidth=1.5; const pl = 12*Math.abs(Math.cos(ph*3)); line(37,-10-pl,37,-10+pl);
}

// фигура человека; o: mode, it (предметы), ph (фаза шага), moving, look, face, col, wave, breath
function person(x, y, o){
  const s = Math.max(.85, H/290);
  ctx.save(); ctx.translate(x,y); ctx.scale(o.face*s, s*(o.breath||1)); ctx.lineCap='round';
  const m = o.mode, it = o.it || {};
  let hip = -20;
  if (m==='sit') hip = -11;
  if (isBike(m)) { bike(o.ph); hip = -27; }
  if (m==='boat') { boat(); hip = -12; }
  if (m==='fly') { plane(o.ph); hip = -16; }
  // ноги
  ctx.strokeStyle='#1c2126'; ctx.lineWidth=2.6;
  if (m==='sit'){ line(0,hip,11,hip); line(11,hip,12,0); }
  else if (isBike(m)){ const a=o.ph*1.2; line(0,hip,-2+Math.cos(a)*6,-12+Math.sin(a)*6); line(0,hip,-2-Math.cos(a)*6,-12-Math.sin(a)*6); }
  else if (m==='climb' || m==='descend'){ const k=Math.sin(o.ph)*4; line(0,hip,4,hip+10+k); line(0,hip,4,hip+10-k); }
  else if (m!=='boat' && m!=='fly'){ const a = o.moving ? Math.sin(o.ph)*.5 : 0; line(0,hip,Math.sin(a)*20,hip+20*Math.cos(a)); line(0,hip,-Math.sin(a)*20,hip+20*Math.cos(a)); }
  // платье
  ctx.fillStyle = o.col; ctx.beginPath(); ctx.moveTo(-8,hip+4); ctx.lineTo(8,hip+4); ctx.lineTo(4,hip-20); ctx.lineTo(-4,hip-20); ctx.closePath(); ctx.fill();
  // голова
  const hx = o.look ? -1.5 : 0, hy = hip-28;
  ctx.fillStyle='#e6c6a4'; ctx.beginPath(); ctx.arc(hx,hy,7,0,7); ctx.fill();
  ctx.fillStyle='#1c2126'; ctx.beginPath(); ctx.arc(hx + (o.look?-4:4), hy-1, 1.3, 0, 7); ctx.fill();
  // руки
  ctx.strokeStyle='#e6c6a4'; ctx.lineWidth=2.2;
  let hand = [8, hip-6];
  if (o.wave) hand = [9, hip-36];
  else if (o.adjust) hand = [4, hip-34];
  else if (m==='climb' || m==='descend') hand = [5, hip-30];
  else if (isBike(m)) hand = [10, hip-6];
  else if (o.moving) hand = [6+Math.sin(o.ph+3)*4, hip-6];
  line(0, hip-18, hand[0], hand[1]);
  // предметы-слои
  if (it.c){ ctx.strokeStyle='#d9b45a'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(2,hip-12,2.6,0,7); ctx.stroke(); }
  if (it.h){ ctx.strokeStyle='#d9cdb4'; ctx.lineWidth=2.4; line(hx-11,hy-5,hx+11,hy-5); ctx.fillStyle='#d9cdb4'; ctx.fillRect(hx-6,hy-12,12,7);
    if (it.f){ ctx.fillStyle='#e0574a'; ctx.beginPath(); ctx.arc(hx+5,hy-10,2.8,0,7); ctx.fill(); } }
  if (it.b){
    if (isBike(m)) basket(17,-31,it.b);
    else if (m==='boat') basket(-20,-16,it.b);
    else if (m==='sit') basket(-12,-4,it.b);
    else if (m!=='fly') basket(hand[0]+1, hand[1]+5, it.b);
  }
  ctx.restore();
}

function ladder(x, gy, angle, L){
  const dx = Math.cos(angle), dy = -Math.sin(angle), nx = -dy*5, ny = dx*5;
  ctx.strokeStyle='#b49a73'; ctx.lineWidth=2;
  line(x+nx,gy+ny,x+nx+dx*L,gy+ny+dy*L); line(x-nx,gy-ny,x-nx+dx*L,gy-ny+dy*L);
  for (let t=10;t<L;t+=13) line(x+nx+dx*t,gy+ny+dy*t,x-nx+dx*t,gy-ny+dy*t);
}

const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function detour(){ const gx=GX(); const x0=worldAt(26,0)+gx+10, x3=worldAt(26,1)+gx-20; return {x0, x1:x0+80, x2:Math.max(x0+90,x3-80), x3, e:H*.17}; }
function elevAt(x){ const d=detour(); if (x<=d.x0||x>=d.x3) return 0; if (x<d.x1) return d.e*ease((x-d.x0)/(d.x1-d.x0)); if (x>d.x2) return d.e*(1-ease((x-d.x2)/(d.x3-d.x2))); return d.e; }
const clamp01 = v => Math.max(0, Math.min(1, v));
let shownCap = '';

function frame(now){
  requestAnimationFrame(frame);
  if (!W) return;
  // плавно догоняем прокрутку
  const tgt = started ? window.scrollY : 0;
  if (Math.abs(tgt - sceneS) > 4000) sceneS = tgt; else sceneS += (tgt - sceneS)*0.18;
  const {i, f} = locate(sceneS), st = S[i];
  const wxT = worldAt(i,f);
  if (Math.abs(wxT - camX) > 3000) camX = wxT; else camX += (wxT - camX)*0.35;
  const rewinding = started && now < rewindUntil;
  const behind = started && !rewinding && window.scrollY < maxS - 600;
  const back = false;
  let mode = modeAt(st, f);
  const moving = Math.abs(wxT - camX) > .3;
  const it = (st.ia && f < st.ia && i>0) ? IT[i-1] : IT[i];
  // сигнал события: новая точка или новый предмет при движении вперёд
  const itemsKey = JSON.stringify(it);
  if (started && !rewinding && (i > lastCp || (itemsKey !== lastItemsKey && i >= lastCp))) pulseT = now;
  lastCp = i; lastItemsKey = itemsKey;
  const gy = groundY(), gx = GX();
  // небо
  const target = PAL[TOD[i]].map(hex);
  colNow = colNow.map((c,k)=> c.map((v,j)=> v + (target[k][j]-v)*0.03));

  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sky = ctx.createLinearGradient(0,0,0,gy); sky.addColorStop(0, rgb(colNow[0])); sky.addColorStop(1, rgb(colNow[1]));
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // звёзды
  if (st.sp==='stars' || TOD[i]==='night'){
    const n = st.sp==='stars' && i===43 ? Math.floor(f*24) : 24;
    ctx.fillStyle='rgba(243,238,229,.85)';
    for (let k=0;k<n;k++){ const sx=(k*97.3)%W, sy=(k*53.7)%(gy*.55); ctx.fillRect(sx,sy,1.6,1.6); }
  }

  // камера: поворот (26) и отъезд (47–48)
  ctx.save();
  let ang = 0, zoom = 1;
  if (st.sp==='camUp'){ ang = f<.1 ? -Math.PI/2*ease(f/.1) : f<.6 ? -Math.PI/2 : -Math.PI/2*(1-ease(clamp01((f-.6)/.3))); }
  if (st.sp==='zoomOut') zoom = 1 - .6*ease(f);
  if (st.sp==='zoomBack') zoom = .4 + .6*ease(clamp01(f/.25));
  ctx.translate(gx, gy); ctx.rotate(ang); ctx.scale(zoom*BASEZOOM, zoom*BASEZOOM); ctx.translate(-gx, -gy);

  hills(gy - H*.3, H*.06, .15, rgb(colNow[2]), 1.3);
  hills(gy - H*.13, H*.04, .45, rgb(colNow[3]), 4.1);

  // дальняя дорога (18)
  if (st.comp==='far' || st.comp==='leave'){ ctx.strokeStyle='rgba(243,238,229,.25)'; ctx.lineWidth=1.5; line(-W*3, gy-H*.2, W*4, gy-H*.2); }

  // земля и вода
  ctx.fillStyle = rgb(colNow[4]); ctx.fillRect(-W*3, gy, W*7, 3000);
  const riverA = worldAt(22,.3)+gx+16, riverB = worldAt(25,.2)+gx+12;
  ctx.fillStyle='#2b4a5c'; ctx.fillRect(riverA-camX, gy, riverB-riverA, 3000);
  const ladX = D[4]+gx, L = H*.55;
  ctx.fillStyle='#2b4a5c'; ctx.fillRect(ladX+14-camX, gy, L-30, 3000);
  // метки на земле, чтобы видеть движение
  ctx.strokeStyle='rgba(243,238,229,.12)'; ctx.lineWidth=1;
  for (let k=Math.floor((camX-W*3)/60); k*60 < camX+W*4; k++){ const x=k*60-camX; line(x, gy+6, x, gy+12); }

  // одинаковые домики (24) и деревня (45–46)
  if (i>=23 && i<=25) for (let k=0;k<9;k++){ const x=D[24]+gx+120+k*70-camX; ctx.fillStyle='#4b5560'; ctx.fillRect(x, gy-H*.14, 30, 24); ctx.beginPath(); ctx.moveTo(x-3,gy-H*.14); ctx.lineTo(x+15,gy-H*.14-12); ctx.lineTo(x+33,gy-H*.14); ctx.fill(); }
  if (i>=44){ const lit = TOD[i]==='night' ? 1 : (TOD[i]==='dawn' ? Math.max(0,1-f*2) : .6);
    for (let k=0;k<26;k++){ const x=D[45]+gx+90+k*58-camX, hh=30+(k%3)*8; ctx.fillStyle='#2b313a'; ctx.fillRect(x, gy-hh, 34, hh);
      ctx.fillStyle=`rgba(242,196,110,${lit})`; ctx.fillRect(x+6, gy-hh+8, 7, 7); if (k%2) ctx.fillRect(x+20, gy-hh+8, 7, 7); } }

  // лестница: стоит (до 5), ложится мостом (6)
  if (i<=8){ let a = Math.PI/2; if (i===6) a = Math.PI/2*(1-ease(clamp01(f/.2))); if (i>6) a = 0; ladder(ladX-camX, gy, a, L);
    if (i<4){ ctx.fillStyle='rgba(243,238,229,.85)'; ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='center'; ctx.fillText('лестница', ladX-camX, gy-L-6); } }

  // тропа-объезд поверху (26)
  if (i>=24 && i<=28){ const d=detour(); ctx.fillStyle = rgb(colNow[3]); ctx.beginPath(); ctx.moveTo(d.x0-camX, gy);
    for (let x=d.x0; x<=d.x3; x+=8) ctx.lineTo(x-camX, gy-elevAt(x)); ctx.lineTo(d.x3-camX, gy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(243,238,229,.25)'; ctx.lineWidth=1.5; ctx.beginPath(); for (let x=d.x0; x<=d.x3; x+=8) ctx.lineTo(x-camX, gy-elevAt(x)); ctx.stroke(); }
  // предметы точек
  for (let k=0;k<=N;k++){ const p=S[k].p; if (!p) continue; const x = (p.at ? worldAt(p.at[0],p.at[1]) : D[k]) + gx + (p.px??40) - camX; if (x<-W*2.5 || x>W*3.5) continue; propBox(x,p,gy); }

  // поезд (2)
  if (i===2){ ctx.fillStyle='#1f262c'; const tx = W*1.15 - f*W*1.6; for (let k=0;k<4;k++) ctx.fillRect(tx+k*15, gy-H*.31, 13, 7); }
  // ёжики (7)
  if (i===7){ ctx.fillStyle='#3a2e26'; const t=clamp01((f-.2)/.5); for (let k=0;k<3;k++){ ctx.beginPath(); ctx.ellipse(gx+44+k*13, gy-4+t*10-(k*2), 6-k, 4-k*.6, 0, 0, 7); ctx.fill(); } }
  // облака (39)
  if (i===39){ ctx.fillStyle='rgba(225,230,232,.85)'; const cx = D[39]+gx+260-camX; ctx.fillRect(cx, 0, 300, gy-H*.38-30); ctx.fillRect(cx, gy-H*.38+16, 300, H); }
  // птицы (38)
  if (i===38){ ctx.strokeStyle='#1c2126'; ctx.lineWidth=1.5; const bx = W*1.1 - f*W*1.9, by = gy-H*.55;
    for (let k=0;k<7;k++){ const ox=bx+Math.abs(k-3)*14, oy=by+Math.abs(k-3)*-8+k*0; line(ox-5,oy-3,ox,oy); line(ox,oy,ox+5,oy-3); } }

  // высота полёта
  const altT = mode==='fly' ? H*(st.comp==='plane2Away' ? .3 : .38) : 0;
  alt += (altT - alt)*0.06;
  // подъём по лестнице
  let climbY = 0;
  if (i===4) climbY = f*L*.6;
  if (i===5) climbY = (1-clamp01(f/.7))*L*.6;
  const face = (mode==='walkL'||mode==='walkLs') ? -1 : 1;
  let ex = 0, ph = camX*.06;
  if (enterT){ const t = clamp01((now-enterT)/1900); ex = -(gx+50)*(1-ease(t)); ph = now*.012; if (t>=1) enterT = null; }
  const idle = now - lastScrollT > 2500;
  const breath = idle && !moving ? 1 + Math.sin(now/650)*.015 : 1;
  const gyY = gy - alt - climbY - (i>=26 ? elevAt(camX + gx) : 0);
  const girlX = gx + ex + (i===4||i===5 ? -8 : 0);

  // другие персонажи
  if (st.comp==='bike') person(gx-46, gy, {mode:'bike', ph:ph+1, moving:true, face:1, col:'#7f96aa'});
  if (st.comp==='leave'){ const t=ease(clamp01((f-.25)/.6)); ctx.save(); ctx.translate(gx-46+t*W*.45, gy - t*H*.2); ctx.scale(1-t*.45,1-t*.45); person(0,0,{mode:'bike', ph:ph+1+t*40, moving:true, face:1, col:'#7f96aa'}); ctx.restore(); }
  if (st.comp==='far'){ ctx.save(); ctx.translate(gx+40+f*30, gy-H*.2); ctx.scale(.55,.55); person(0,0,{mode:'bike', ph:ph+1, moving:true, face:1, col:'#7f96aa', wave:f>.15&&f<.4}); ctx.restore(); }
  if (i>=25 && i<=29){ const cx = worldAt(27,.3)+gx-camX; if (cx>-120 && cx<W+160){
    ctx.fillStyle='#8a7a66'; ctx.fillRect(cx+16, gy-20, 28, 3); ctx.fillRect(cx+28, gy-20, 3, 20);
    ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle='rgba(243,238,229,.5)'; ctx.strokeRect(cx-30, gy-70, 120, 70); ctx.setLineDash([]);
    ctx.fillStyle='rgba(243,238,229,.85)'; ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='center'; ctx.fillText('кафе', cx+30, gy-76); ctx.restore();
    if (i<=28) person(cx+56, gy, {mode:'sit', face:-1, col:'#7f96aa'});
    if (st.sp==='jar'){ ctx.fillStyle='rgba(225,230,232,.35)'; ctx.fillRect(cx+24, gy-32, 9, 12); ctx.fillStyle='#d8774a'; ctx.fillRect(cx+24, gy-28, 9, 4); } } }
  if (st.comp==='plane2' || st.comp==='plane2Away'){ const t = st.comp==='plane2Away' ? ease(clamp01((f-.2)/.6)) : 0; const s=Math.max(.85,H/290);
    ctx.save(); ctx.translate(gx+90+t*W*.3, gy-H*.38-30-t*H*.3); ctx.scale(s*(1-t*.4), s*(1-t*.4)); ctx.rotate(Math.sin(now/300)*(st.comp==='plane2Away' && f<.3 ? .15 : .02)); plane(ph+.5, '#8fa3b5'); ctx.restore(); }

  if (started) person(girlX, gyY, {mode, it, ph, moving: moving || !!enterT, look: back, face, col:'#d8774a', breath,
    wave: st.sp==='wave' && f>.15 && f<.4 && !back, adjust: st.sp==='adjust' && f>.3 && f<.5});

  // сигнал события: расходящееся кольцо
  const pt = (now - pulseT) / 900;
  if (started && pt >= 0 && pt < 1){ ctx.strokeStyle = `rgba(243,228,200,${(1-pt)*.8})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(girlX, gyY - 26, 18 + pt*46, 0, 7); ctx.stroke(); }

  // улетающий цветок (33)
  if (st.sp==='wind' && f>.4){ const t=clamp01((f-.4)/.5); ctx.fillStyle='#e0574a'; ctx.beginPath(); ctx.arc(girlX - t*W*.5, gyY - 44 - t*H*.35 + Math.sin(t*12)*8, 2.8, 0, 7); ctx.fill(); }

  ctx.restore();

  // дождь
  if (st.sp==='rain' || (i===36 && f<.5)){ ctx.strokeStyle='rgba(200,215,225,.35)'; ctx.lineWidth=1;
    for (let k=0;k<60;k++){ const x=(k*53+now*.05)%W, y=((k*37)+now*.6)%H; line(x,y,x-3,y+10); } }

  if (rewinding){ ctx.fillStyle = 'rgba(40,52,64,.28)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(243,238,229,.05)'; for (let y=(now*.2)%6; y<H; y+=6) ctx.fillRect(0,y,W,1); }
  const flash = (now - pulseT) / 700;
  if (started && flash >= 0 && flash < 1){ ctx.fillStyle = `rgba(255,240,215,${(1-flash)*.12})`; ctx.fillRect(0,0,W,H); }

  // подпись и полоска
  const capTxt = !started ? '' : `<span><b>${i} / ${N}</b> · ${st.a}</span>`;
  if (capTxt !== shownCap){ capEl.innerHTML = capTxt; shownCap = capTxt; }
  capEl.classList.toggle('pulse', started && now - pulseT < 2200);
  rwEl.hidden = !rewinding;
  if (!(started && window.scrollY < maxS - 600)) backDismissed = false;
  backbar.hidden = !(behind && !backDismissed);
  barfill.style.width = (100*maxS/starts[N+1]) + '%';
}

/* ============ интерфейс ============ */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=> toastEl.hidden = true, 3200); }

function copyLink(cp){
  const url = PUBLIC_URL + '#r' + cp;
  const ok = () => toast('Ссылка скопирована. Она заработает, когда сайт будет опубликован.');
  const fail = () => toast(url);
  try { navigator.clipboard.writeText(url).then(ok, fail); } catch(e){ fail(); }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.js-copy'); if (!b) return;
  const cp = b.dataset.cp === 'current' ? locate(window.scrollY).i : +b.dataset.cp;
  copyLink(cp);
});

document.getElementById('playbtn').addEventListener('click', ()=> start(true));
backchip.addEventListener('click', ()=> window.scrollTo({top: maxS, behavior: 'smooth'}));
document.getElementById('backx').addEventListener('click', ()=>{ backDismissed = true; backbar.hidden = true; });

const markSheet = document.getElementById('mark');
document.getElementById('markbtn').addEventListener('click', ()=> { markSheet.hidden = !markSheet.hidden; });
document.getElementById('mark-close').addEventListener('click', ()=> markSheet.hidden = true);
document.getElementById('mark-restart').addEventListener('click', ()=>{
  try { localStorage.removeItem(STORE); } catch(e){}
  clearHash();
  markSheet.hidden = true; maxS = 0; sceneS = 0; camX = 0; started = false; lastY = 0; lastCp = 0; lastItemsKey = ''; pulseT = -1e9; rewindUntil = 0; backDismissed = false; alt = 0;
  barfill.style.width = '0%';
  document.getElementById('play').hidden = false; window.scrollTo({top:0});
  clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.removeItem(STORE); }catch(e){} }, 900);
});

function clearHash(){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
function restoreTo(cur, max){
  measure();
  const y = scrollFor(cur[0], cur[1]), m = scrollFor(max[0], max[1]);
  started = true; document.getElementById('play').hidden = true;
  maxS = Math.max(y, m); sceneS = y; lastY = y; const c = locate(y); camX = worldAt(c.i, c.f); lastCp = c.i;
  window.scrollTo({top: y});
}

function init(){
  measure();
  const hm = /^#r(\d{1,2})$/.exec(location.hash);
  if (hm && +hm[1] <= N){ const n=+hm[1]; restoreTo([n,0.001],[n,0.001]); }
  else {
    const saved = load();
    if (saved && saved.max && (saved.max[0] > 0 || saved.max[1] > .2)){
      const sheet = document.getElementById('resume');
      document.getElementById('resume-text').textContent = `Вы остановились на точке ${saved.cur[0]} из ${N}: «${secs[saved.cur[0]].querySelector('h1,h2').textContent}».`;
      sheet.hidden = false;
      document.getElementById('resume-go').onclick = ()=>{ sheet.hidden = true; restoreTo(saved.cur, saved.max); };
      document.getElementById('resume-start').onclick = ()=>{ sheet.hidden = true; try{ localStorage.removeItem(STORE); }catch(e){} clearHash(); };
    }
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  requestAnimationFrame(frame);
}
let resizeT = 0;
window.addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT = setTimeout(measure, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=> { measure(); });
init();
</script>
